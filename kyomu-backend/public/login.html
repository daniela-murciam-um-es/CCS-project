<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Anton&family=Oswald&family=Teko&family=Titillium+Web:wght@400;600&display=swap" rel="stylesheet">

<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kyomu — Iniciar sesión</title>
  <link rel="stylesheet" href="/css/estilos.css" />
</head>

<body>

  <header>
    <div class="header-left">
      <img src="image/kyomu.png" class="logo">
    </div>
  
    <h1 class="main-title">CLUB DEPORTIVO KYOMU</h1>
  </header>
  
  

<div class="login-container">
  <!-- Botón = enlace directo al Hosted UI con response_type=token -->
  <a class="login-link" id="cognito-login">
    <button id="login-btn" class="login-btn">
      Iniciar sesión con Cognito
    </button>
  </a>

  <p style="margin-top:12px; text-align:center;">
    <a href="#" onclick="resetCognitoSession(); return false;">
      ¿Problemas para entrar? Reiniciar sesión
    </a>
  </p>
  
  

</div>

<!-- Config con dominio, etc. -->
<script src="/js/aws-exports.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const cfg = window.awsconfig;
    const loginLink = document.getElementById("cognito-login");

    const domain = cfg.oauth.domain;
    const clientId = cfg.aws_user_pools_web_client_id;
    const redirectUri = encodeURIComponent(cfg.oauth.redirectSignIn);
    const scope = encodeURIComponent(cfg.oauth.scope.join(" "));
    const responseType = cfg.oauth.responseType || "token";

    loginLink.href =
      `https://${domain}/oauth2/authorize` +
      `?client_id=${clientId}` +
      `&redirect_uri=${redirectUri}` +
      `&response_type=${responseType}` +
      `&scope=${scope}` +
      `&prompt=login`;
  });
</script>

<script>
  function resetCognitoSession() {
    const cfg = window.awsconfig;
    const domain = cfg.oauth.domain;
    const clientId = cfg.aws_user_pools_web_client_id;
    const logoutUri = encodeURIComponent(cfg.oauth.redirectSignOut);

    // Esto fuerza a Cognito a borrar cookies/sesión y vuelve al login
    const url = `https://${domain}/logout?client_id=${clientId}&logout_uri=${logoutUri}`;
    window.location.href = url;
  }
</script>


<!-- Lógica nuestra (sin Amplify) -->
<script src="/js/scripts.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    console.log("Login.html cargado");

    // Si volvemos de Cognito con #id_token=..., scripts.js lo detectará,
    // guardará el token y nos redirigirá según rol.
  });
</script>

</body>
</html>
